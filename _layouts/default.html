<!DOCTYPE html>
<html lang="br">

  {% include head.html %}

  <body>

    <div id="fb-root"></div>
    <script>(function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = "//connect.facebook.net/pt_BR/sdk.js#xfbml=1&version=v2.10&appId=1633315206961348";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));</script>

    {% if layout.header != false %}
      {% include header.html %}
      <main class="page-content">
    {% else %}
      <main class="page-content" style="margin-top:0">
    {% endif %}

      <div class="main-wrapper wrapper">
        {{ content }}
      </div>

    </main>

    {% if layout.footer != false %}
      {% include footer.html %}
    {% endif %}

    {% if site.enable_disqus %}
      <script id="dsq-count-scr" src="//videogamescomcerveja.disqus.com/count.js" async></script>
    {% endif %}

    {% if site.enable_analytics %}
      <script>
        window.addEventListener('load', function() {
          setTimeout(function() {
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-DYEHQ7JP6L';
            document.head.appendChild(script);

            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DYEHQ7JP6L');
          }, 1000);
        });
      </script>

      <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d149fa21ba174efdb0418266505700c9"}'></script>
    {% endif %}

  </body>

</html>
